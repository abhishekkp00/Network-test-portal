server:
  port: 8082

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Production-safe connection pool settings
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    # Disable SQL logging in production — enable only in dev profile
    show-sql: false
    properties:
      hibernate:
        format_sql: false

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    expiration: ${SECURITY_JWT_EXPIRATION}

workers:
  python-path: ${WORKERS_PYTHON_PATH:python3}
  ping-script-path: ${WORKERS_PING_SCRIPT_PATH}
  iperf-script-path: ${WORKERS_IPERF_SCRIPT_PATH}
  timeout-seconds: ${WORKERS_TIMEOUT_SECONDS:30}
  max-output-bytes: ${WORKERS_MAX_OUTPUT_BYTES:1048576}
  max-concurrent-processes: ${WORKERS_MAX_CONCURRENT_PROCESSES:10}
  target-protection:
    enabled: ${WORKERS_TARGET_PROTECTION_ENABLED:true}
    allow-loopback: ${WORKERS_ALLOW_LOOPBACK:false}

alerts:
  slack-webhook-url: ${ALERTS_SLACK_WEBHOOK_URL:}
  discord-webhook-url: ${ALERTS_DISCORD_WEBHOOK_URL:}
  email-recipient: ${ALERTS_EMAIL_RECIPIENT:}
  latency-threshold-ms: ${ALERTS_LATENCY_THRESHOLD_MS:100.0}
  packet-loss-threshold-pct: ${ALERTS_PACKET_LOSS_THRESHOLD_PCT:5.0}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:8080,http://localhost:8082,http://localhost:8083,http://localhost:5173,http://127.0.0.1}

agents:
  heartbeat:
    degraded-threshold-seconds: ${AGENTS_HEARTBEAT_DEGRADED_THRESHOLD_SECONDS:30}
    offline-threshold-seconds: ${AGENTS_HEARTBEAT_OFFLINE_THRESHOLD_SECONDS:90}

jobs:
  executor:
    core-pool-size: ${JOBS_EXECUTOR_CORE_POOL_SIZE:5}
    max-pool-size: ${JOBS_EXECUTOR_MAX_POOL_SIZE:10}
    queue-capacity: ${JOBS_EXECUTOR_QUEUE_CAPACITY:25}
    thread-name-prefix: ${JOBS_EXECUTOR_THREAD_NAME_PREFIX:network-job-}
    await-termination-seconds: ${JOBS_EXECUTOR_AWAIT_TERMINATION_SECONDS:30}
  stale-timeout-seconds: ${JOBS_STALE_TIMEOUT_SECONDS:60}
  retry:
    max-attempts: ${JOBS_RETRY_MAX_ATTEMPTS:3}
    initial-interval-seconds: ${JOBS_RETRY_INITIAL_INTERVAL_SECONDS:5}
    multiplier: ${JOBS_RETRY_MULTIPLIER:2.0}
    max-interval-seconds: ${JOBS_RETRY_MAX_INTERVAL_SECONDS:60}
  recovery:
    interval-ms: ${JOBS_RECOVERY_INTERVAL_MS:10000}




---
# Development profile: enable verbose SQL logging
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.networkportal: DEBUG
