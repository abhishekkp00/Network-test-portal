server:
  port: 8082

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Production-safe connection pool settings
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    # Disable SQL logging in production — enable only in dev profile
    show-sql: false
    properties:
      hibernate:
        format_sql: false

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    expiration: ${SECURITY_JWT_EXPIRATION}

workers:
  python-path: ${WORKERS_PYTHON_PATH:python3}
  ping-script-path: ${WORKERS_PING_SCRIPT_PATH}
  iperf-script-path: ${WORKERS_IPERF_SCRIPT_PATH}
  timeout-seconds: ${WORKERS_TIMEOUT_SECONDS:30}

alerts:
  slack-webhook-url: ${ALERTS_SLACK_WEBHOOK_URL:}
  discord-webhook-url: ${ALERTS_DISCORD_WEBHOOK_URL:}
  email-recipient: ${ALERTS_EMAIL_RECIPIENT:}
  latency-threshold-ms: ${ALERTS_LATENCY_THRESHOLD_MS:100.0}
  packet-loss-threshold-pct: ${ALERTS_PACKET_LOSS_THRESHOLD_PCT:5.0}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://127.0.0.1}


---
# Development profile: enable verbose SQL logging
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.networkportal: DEBUG
