version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: network_portal_db
    restart: always
    environment:
      POSTGRES_DB: network_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
