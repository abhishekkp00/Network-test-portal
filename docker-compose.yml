version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: network_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB:-network_portal}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-test-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network_portal_backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB:-network_portal}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET}
      - SECURITY_JWT_EXPIRATION=${SECURITY_JWT_EXPIRATION:-86400000}
      - APP_SECURITY_DEFAULT_ADMIN_USERNAME=${APP_SECURITY_DEFAULT_ADMIN_USERNAME:-admin}
      - APP_SECURITY_DEFAULT_ADMIN_EMAIL=${APP_SECURITY_DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - APP_SECURITY_DEFAULT_ADMIN_PASSWORD=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD}
      - WORKERS_PYTHON_PATH=python3
      - WORKERS_PING_SCRIPT_PATH=../python-workers/ping_worker.py
      - WORKERS_IPERF_SCRIPT_PATH=../python-workers/iperf_worker.py
      - WORKERS_TIMEOUT_SECONDS=30
    depends_on:
      - db
    networks:
      - network-test-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network_portal_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - network-test-net

volumes:
  postgres_data:

networks:
  network-test-net:
    driver: bridge
