version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: network_portal_db
    restart: always
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB:-network_portal}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network-test-net
    # Wait until Postgres is actually accepting connections before starting backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d ${SPRING_DATASOURCE_DB:-network_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: network_portal_backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB:-network_portal}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET}
      - SECURITY_JWT_EXPIRATION=${SECURITY_JWT_EXPIRATION:-86400000}
      - APP_SECURITY_DEFAULT_ADMIN_USERNAME=${APP_SECURITY_DEFAULT_ADMIN_USERNAME:-admin}
      - APP_SECURITY_DEFAULT_ADMIN_EMAIL=${APP_SECURITY_DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - APP_SECURITY_DEFAULT_ADMIN_PASSWORD=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD}
      - WORKERS_PYTHON_PATH=python3
      # CRITICAL FIX: Use container-local paths where the scripts are mounted via volume below
      - WORKERS_PING_SCRIPT_PATH=/app/python-workers/ping_worker.py
      - WORKERS_IPERF_SCRIPT_PATH=/app/python-workers/iperf_worker.py
      - WORKERS_TIMEOUT_SECONDS=30
      - ALERTS_SLACK_WEBHOOK_URL=${ALERTS_SLACK_WEBHOOK_URL:-}
      - ALERTS_DISCORD_WEBHOOK_URL=${ALERTS_DISCORD_WEBHOOK_URL:-}
      - ALERTS_EMAIL_RECIPIENT=${ALERTS_EMAIL_RECIPIENT:-}
      - ALERTS_LATENCY_THRESHOLD_MS=${ALERTS_LATENCY_THRESHOLD_MS:-100.0}
      - ALERTS_PACKET_LOSS_THRESHOLD_PCT=${ALERTS_PACKET_LOSS_THRESHOLD_PCT:-5.0}
    volumes:
      # Mount the python-workers directory into the backend container so scripts are accessible
      - ./python-workers:/app/python-workers:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network-test-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: network_portal_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - network-test-net

volumes:
  postgres_data:

networks:
  network-test-net:
    driver: bridge
